[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"

[workspace.dependencies]
dc-protocol = { path = "crates/dc-protocol" }
dc-gateway = { path = "crates/dc-gateway" }
dc-api = { path = "crates/dc-api" }
dc-core = { path = "crates/dc-core" }
dc-store = { path = "crates/dc-store" }
dc-ui = { path = "crates/dc-ui" }
dc-plugin-host = { path = "crates/dc-plugin-host" }
dc-audio = { path = "crates/dc-audio" }
dc-voice = { path = "crates/dc-voice" }

anyhow = "1"
pulldown-cmark = { version = "0.13.6", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
rusqlite = { version = "0.42.0", default-features = false, features = ["bundled"] }
keyring = { version = "3.6.3", default-features = false }
fastrand = "2"
futures = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# GPUI 0.2.2 is the newest release on crates.io and depends on `xattr 0.2`,
# which does not compile against libc >= 0.2.190. `dc-ui` therefore pins
# libc exactly; drop that pin when a newer GPUI is published.
gpui = "0.2.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "std"] }
zeroize = "1"
