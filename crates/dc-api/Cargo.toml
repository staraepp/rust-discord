[package]
name = "dc-api"
description = "Discord REST client with per-bucket rate limiting behind HttpTransport/Clock traits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["reqwest"]
# Real HTTPS transport (reqwest + rustls) and the tokio clock.
reqwest = ["dep:reqwest", "tokio/time"]

[dependencies]
dc-protocol.workspace = true
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[lints]
workspace = true
