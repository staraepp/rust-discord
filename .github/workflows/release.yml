name: release

# Publishing a release, either way builds the Arch package first:
#   - push a `v*` tag, or
#   - run this workflow manually on `main` ("Run workflow"); the release then
#     creates the tag `v<pkgver>` itself.
# Pull requests touching the packaging: build only, to prove it still works.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  arch-package:
    name: build Arch package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Install build tools
        # makepkg runs as an unprivileged user and cannot install the
        # package's dependencies itself, so they are installed here.
        # vulkan-swrast is the software driver; it satisfies `vulkan-driver`.
        run: >-
          pacman -Syu --noconfirm --needed rust git
          libxcb libxkbcommon libxkbcommon-x11 wayland fontconfig freetype2
          vulkan-icd-loader vulkan-swrast alsa-lib opus cmake
      - uses: actions/checkout@v4
      - name: Check versions agree
        id: version
        run: |
          pkgver="$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)"
          grep -q "^version = \"$pkgver\"$" Cargo.toml
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "v$pkgver" = "$GITHUB_REF_NAME"
          fi
          echo "tag=v$pkgver" >> "$GITHUB_OUTPUT"
      - name: Build with makepkg
        run: |
          # makepkg refuses to run as root. Build exactly this commit by
          # pointing the PKGBUILD's git source at the checkout.
          git config --system --add safe.directory '*'
          useradd -m builder
          install -d -o builder /build
          sed "s|^source=.*|source=(\"\$pkgname::git+file://$GITHUB_WORKSPACE#commit=$GITHUB_SHA\")|" \
            packaging/arch/PKGBUILD > /build/PKGBUILD
          chown builder /build/PKGBUILD
          cd /build
          sudo -u builder makepkg --noconfirm
          pacman -U --noconfirm ./*.pkg.tar.zst
          dc-cli help
          # The GUI cannot open a window here; check it starts far enough to
          # ask for the token.
          dc-client --help
          dc-client --version
          sha256sum ./*.pkg.tar.zst > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: |
            /build/*.pkg.tar.zst
            /build/SHA256SUMS
          if-no-files-found: error

  publish:
    name: publish GitHub release
    # Manual runs may only release from main.
    if: >-
      github.ref_type == 'tag' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: arch-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: arch-package
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.arch-package.outputs.tag }}
        run: |
          # Creates the tag at this commit if it does not exist yet; fails if
          # a release for it already exists (bump pkgver for a new one).
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "$TAG (early preview)" \
            --notes-file packaging/RELEASE_NOTES.md
